services:
  api:
    build: .
    image: tender-collector-api:1.0.0
    container_name: tender-collector-api
    ports:
      - "8000:8000"
    depends_on:
      sample-site:
        condition: service_healthy
      rate-limit-site:
        condition: service_healthy
    restart: unless-stopped

  sample-site:
    image: nginx:1.27-alpine
    container_name: tender-sample-site
    ports:
      - "8080:80"
    volumes:
      - ./sample-site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/list.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 限流演示站点：仅用 Python 标准库实现，离线可运行；对部分详情页返回 429 + Retry-After
  rate-limit-site:
    image: python:3.11-slim
    container_name: tender-rate-limit-site
    working_dir: /workspace
    command: ["python", "-I", "/workspace/sample-site/ratelimit_server.py", "--host", "0.0.0.0", "--port", "8081", "--root", "/workspace/sample-site"]
    ports:
      - "8081:8081"
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/ratelimited/list.html', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
